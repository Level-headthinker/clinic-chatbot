name: backend-tests

# Runs the backend test suite on every push / PR. A disposable Postgres service
# is provided so the integration tests that need real Postgres (the
# double-booking partial-unique-index guard) actually RUN instead of skipping —
# on SQLite they would silently pass and give a false green.

on:
  push:
    branches: [main, final0.1]
  pull_request:
    branches: [main, final0.1]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clinicbot
          POSTGRES_PASSWORD: clinicbot
          POSTGRES_DB: clinicbot_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job starts.
        options: >-
          --health-cmd "pg_isready -U clinicbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Real Postgres → the booking-race integration tests run for real.
      TEST_DATABASE_URL: postgresql://clinicbot:clinicbot@localhost:5432/clinicbot_test
      # The app's own settings need a DATABASE_URL to import; point it at the same
      # disposable DB. No secrets are needed — the suite mocks external calls.
      DATABASE_URL: postgresql://clinicbot:clinicbot@localhost:5432/clinicbot_test
      SECRET_KEY: ci_test_secret_key_at_least_32_characters_long
      GROQ_API_KEY: ci-dummy-key
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q
